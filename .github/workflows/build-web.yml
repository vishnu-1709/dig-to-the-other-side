name: Build web + publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Balance check
        run: python3 tools/balance_sim.py

      - name: Find latest stable Godot
        id: godot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --repo godotengine/godot --json tagName -q .tagName)
          echo "Using Godot $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "dir=${TAG/-/.}" >> "$GITHUB_OUTPUT"   # 4.5.1-stable -> 4.5.1.stable

      - name: Cache Godot
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ steps.godot.outputs.tag }}

      - name: Install Godot + export templates
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${{ steps.godot.outputs.tag }}
          mkdir -p ~/godot && cd ~/godot
          gh release download "$TAG" --repo godotengine/godot -p "Godot_v${TAG}_linux.x86_64.zip" -p "Godot_v${TAG}_export_templates.tpz"
          unzip -q "Godot_v${TAG}_linux.x86_64.zip"
          mv "Godot_v${TAG}_linux.x86_64" godot && chmod +x godot
          mkdir -p ~/.local/share/godot/export_templates/${{ steps.godot.outputs.dir }}
          unzip -q "Godot_v${TAG}_export_templates.tpz"
          mv templates/* ~/.local/share/godot/export_templates/${{ steps.godot.outputs.dir }}/
          rm -rf templates *.zip *.tpz

      - name: Import project
        run: ~/godot/godot --headless --import 2>&1 | tee import.log || true

      - name: Unit tests
        run: |
          ~/godot/godot --headless --script res://tests/test_game.gd 2>&1 | tee test.log
          grep -q TEST_OK test.log

      - name: Bot playthrough (headless, 8 runs)
        run: |
          timeout 300 ~/godot/godot --headless -- --autoplay 2>&1 | tee autoplay.log
          grep -q AUTOPLAY_OK autoplay.log
          ! grep -E "SCRIPT ERROR|Parse Error|Invalid call|Invalid access" autoplay.log import.log

      - name: Bot plays the whole game to the breakthrough
        run: |
          timeout 900 ~/godot/godot --headless -- --autoplay=full 2>&1 | tee fullplay.log | grep -E "AUTOPLAY|RUN_END.*breakthrough=true|SCRIPT ERROR" || true
          grep -q "AUTOPLAY_FULL broke_through=true" fullplay.log
          grep "AUTOPLAY_FULL" fullplay.log >> "$GITHUB_STEP_SUMMARY"
          ! grep -E "SCRIPT ERROR|Invalid call|Invalid access" fullplay.log

      - name: Export web build
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --export-release "Web" build/web/index.html 2>&1 | tee export.log
          test -f build/web/index.wasm || (echo "EXPORT FAILED" && exit 1)
          ls -la build/web

      - name: Size check (brotli, limit 8 MB)
        run: |
          sudo apt-get install -y -qq brotli >/dev/null
          python3 - <<'EOF'
          import os, subprocess, sys
          total = 0
          for f in sorted(os.listdir("build/web")):
              p = os.path.join("build/web", f)
              raw = os.path.getsize(p)
              br = len(subprocess.run(["brotli", "-c", "-q", "11", p], capture_output=True).stdout)
              total += br
              print(f"{f:<28}{raw/1e6:8.2f} MB raw {br/1e6:8.2f} MB brotli")
          print(f"TOTAL brotli: {total/1e6:.2f} MB")
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(f"### Web build size: {total/1e6:.2f} MB (brotli)\n")
          sys.exit(1 if total > 8e6 else 0)
          EOF

      - name: Package upload zip and publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd build/web && zip -qr ../../dig-to-the-other-side-web.zip .)
          ls -la dig-to-the-other-side-web.zip
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest web build" --notes "Ready-to-upload HTML5 build: index.html is at the root of the zip. Rebuilt on every push to main."
          gh release upload latest dig-to-the-other-side-web.zip --clobber

      - name: Smoke test in headless Chromium
        run: |
          pip install -q playwright
          python3 -m playwright install --with-deps chromium >/dev/null
          python3 tests/smoke_test.py build/web report

      - name: Record store preview videos (commits tagged [video])
        if: contains(github.event.head_commit.message, '[video]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          which ffmpeg || sudo apt-get install -y -qq ffmpeg >/dev/null
          python3 tests/record_preview.py build/web videos
          cp videos/preview_*.mp4 report/
          gh release upload latest videos/preview_landscape.mp4 videos/preview_portrait.mp4 --clobber

      - name: Publish report to ci-report branch
        if: always()
        run: |
          mkdir -p report && cp export.log import.log test.log autoplay.log fullplay.log report/ 2>/dev/null || true
          cd report
          git init -q -b ci-report
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -q -m "report for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-report

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
